<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q15 Employee Management</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head>
<body><div id="root"></div><script type="text/babel">
function Employee({ employee, onEdit }) { return <li><strong>{employee.name}</strong> - {employee.role} <button onClick={() => onEdit(employee)}>Edit</button></li>; }
function App() {
  const [employees, setEmployees] = React.useState([{ id: 1, name: 'Ananya', role: 'Developer' }]);
  const [form, setForm] = React.useState({ id: null, name: '', role: '' });
  function saveEmployee(event) { event.preventDefault(); if (!form.name || !form.role) return; if (form.id) setEmployees(employees.map((employee) => employee.id === form.id ? form : employee)); else setEmployees([...employees, { ...form, id: Date.now() }]); setForm({ id: null, name: '', role: '' }); }
  return <main><h1>Employee Management</h1><form onSubmit={saveEmployee}><input placeholder="Name" value={form.name} onChange={(event) => setForm({ ...form, name: event.target.value })} /><input placeholder="Role" value={form.role} onChange={(event) => setForm({ ...form, role: event.target.value })} /><button>{form.id ? 'Update' : 'Add'} employee</button></form><ul>{employees.map((employee) => <Employee key={employee.id} employee={employee} onEdit={setForm} />)}</ul></main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
