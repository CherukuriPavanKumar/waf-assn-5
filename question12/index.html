<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q12 Counter</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head>
<body><div id="root"></div><script type="text/babel">
function App() {
  const [count, setCount] = React.useState(0);
  return <main><h1>Counter: {count}</h1><button onClick={() => setCount(count + 1)}>Increment</button><button onClick={() => setCount(count - 1)}>Decrement</button><button onClick={() => setCount(0)}>Reset</button></main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
